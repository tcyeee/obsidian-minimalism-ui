name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"

      - name: Build plugin
        run: |
          npm install
          npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # actions/checkout only fetches the commit the tag points to and creates
          # a local lightweight ref for it, discarding the annotated tag object (and
          # its message). Force-fetch the real tag object by ref name so `%(contents)`
          # below reflects the annotation we wrote, not the commit's message.
          git fetch origin "refs/tags/$tag:refs/tags/$tag" --force

          notes="$(git tag -l --format='%(contents)' "$tag")"

          if [ -n "$notes" ]; then
            echo "$notes" > /tmp/release-notes.md
            gh release create "$tag" \
              --title="$tag" \
              --draft \
              --notes-file /tmp/release-notes.md \
              main.js manifest.json styles.css
          else
            gh release create "$tag" \
              --title="$tag" \
              --draft \
              --generate-notes \
              main.js manifest.json styles.css
          fi
